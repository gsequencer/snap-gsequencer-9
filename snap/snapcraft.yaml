name: gsequencer-9
version: '9.0.4'
summary: Advanced Gtk+ Sequencer
description: |
  GSequencer is intended to be use for music composition. It features
  notation, automation and wave form editor. Supporting LADSPA, DSSI
  and LV2 plugins.
icon: snap/local/ags.png

base: core24
grade: stable
confinement: strict

parts:
  gsequencer-9:
    source: https://download-mirror.savannah.gnu.org/releases/gsequencer/9.0.x/gsequencer-9.0.4.tar.gz # See 'snapcraft plugins'
    plugin: autotools
    build-packages: [wget,fop,libinstpatch-dev,libsndfile-dev,libsamplerate-dev,ladspa-sdk,dssi-dev,lv2-dev,libfftw3-dev,libasound2-dev,libjack-jackd2-dev,uuid-dev,libcunit1-dev,docbook-xsl,docbook-xml,gtk-doc-tools,xsltproc]
    stage-packages: [libinstpatch-1.0-2,libfftw3-double3,libfftw3-single3,libsndfile1,libsamplerate0,cmt,xsynth-dssi,calf-plugins,invada-studio-plugins-lv2,swh-plugins,mda-lv2,hydrogen-drumkits,fluid-soundfont-gm,fluid-soundfont-gs]
    override-build: |
      ./configure --prefix=/snap --enable-public-libgsequencer --enable-snap-sandbox --with-poppler --with-gtk-unix-print --disable-introspection
      make -j $SNAPCRAFT_PARALLEL_BUILD_COUNT
      make -j1 pdf
      DESTDIR=$CRAFT_PART_INSTALL make -j1 install
      DESTDIR=$CRAFT_PART_INSTALL make -j1 install-pdf-mkdir
      DESTDIR=$CRAFT_PART_INSTALL make -j1 install-pdf
      rm -rf $CRAFT_PART_INSTALL/snap/include
    override-pull: |
      snapcraftctl pull
      autoreconf -fi
    prime:
      - usr/bin/gsequencer
      - usr/bin/midi2xml
      - usr/lib/libags*
      - usr/lib/libgsequencer*
      - usr/lib/ladspa/*
      - usr/lib/dssi/*
      - usr/lib/lv2/*
      - usr/lib/$CRAFT_ARCH_TRIPLET/calf/*
      - usr/lib/$CRAFT_ARCH_TRIPLET/libFLAC*
      - usr/lib/$CRAFT_ARCH_TRIPLET/libasound*
